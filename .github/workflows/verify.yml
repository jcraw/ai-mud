# MUD-016 — required PR/push check: compile + core unit green + detekt + Konsist + test-lock
# Quarantine excluded (default excludeTags). No secrets / no OpenAI.
# MUD-032 no_live_llm_unit needs rg on the runner.
name: Verify

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ripgrep (no_live_llm_unit gate)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Verify (core)
        run: ./tools/verify_mud.sh --core
